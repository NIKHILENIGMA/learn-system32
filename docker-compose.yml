services:
  postgres:
    image: postgres:16-alpine
    container_name: learn-system32-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: learn_system32
    volumes:
      - learn_system32_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d learn_system32"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  learn_system32_pgdata:
